name: Stamp build version (cache-bust)

# Every push to main:
#   • replace __BUILD__ (or an older ?v=SHA) in index.html with the new short SHA
#   • append/refresh ?v=SHA on every relative .js import across the js/ tree
# Then commit the stamped files back with [skip ci] so we don't loop.

on:
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - '.github/workflows/stamp-build.yml'

jobs:
  stamp:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Skip if this commit IS the stamp
        id: gate
        run: |
          MSG=$(git log -1 --pretty=%B)
          if echo "$MSG" | grep -qF "[skip ci]"; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Stamp
        if: steps.gate.outputs.skip == 'false'
        run: |
          SHORT=$(git rev-parse --short HEAD)
          echo "Stamping build $SHORT"

          # --- index.html ---
          # 1) Normalise any existing ?v=... back to the literal token
          sed -i -E 's|\?v=[a-zA-Z0-9_]+|?v=__BUILD__|g' index.html
          # 2) Replace __BUILD__ with the new SHA
          sed -i "s/__BUILD__/$SHORT/g" index.html

          # --- js/**/*.js ---
          # 1) Strip any pre-existing ?v=... from relative .js imports
          find js -name '*.js' -print0 | xargs -0 sed -i -E \
            "s|(from '\\.{1,2}/[^']+\\.js)\\?v=[a-zA-Z0-9_]+|\\1|g"
          # 2) Append ?v=SHORT to every relative .js import that doesn't have one
          find js -name '*.js' -print0 | xargs -0 sed -i -E \
            "s|from '(\\.{1,2}/[^']+\\.js)'|from '\\1?v=$SHORT'|g"

      - name: Commit stamped files
        if: steps.gate.outputs.skip == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js
          if git diff --staged --quiet; then
            echo "No changes to stamp."
          else
            git commit -m "chore: stamp build $(git rev-parse --short HEAD) [skip ci]"
            git push
          fi
